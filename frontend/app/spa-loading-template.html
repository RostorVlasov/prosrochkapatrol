<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #2B2B2B;
      --accent: #A0876E;
      --dot: #A0876E;
      --shadow: rgba(160, 135, 110, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #E7DDCD;
        --accent: #E7DDCD;
        --dot: #E7DDCD;
        --shadow: rgba(231, 221, 205, 0.3);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s ease;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      width: 80px;
      height: auto;
      animation: float 3s ease-in-out infinite;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 4px 12px var(--shadow));
    }
    .glow {
      position: absolute;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      opacity: 0.4;
      filter: blur(20px);
      animation: pulse 2s ease-in-out infinite;
      z-index: 1;
    }
    .dots {
      display: flex;
      gap: 8px;
    }
    .dots span {
      width: 12px;
      height: 12px;
      background: var(--dot);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    .text {
      font-size: 14px;
      font-weight: 500;
      opacity: 0.7;
      animation: fade 1.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    @keyframes fade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="logo-wrap">
      <div class="glow"></div>
      <img src="/logo.png" alt="FreshCheck" class="logo">
    </div>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
    <p class="text">Загружаем данные...</p>
  </div>
</body>
</html>
