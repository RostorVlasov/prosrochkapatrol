name: Zip Deploy (Stable Jino)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      # =========================
      # BUILD FRONTEND
      # =========================
      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      # =========================
      # BUILD BACKEND
      # =========================
      - name: Build backend
        working-directory: ./backend
        run: |
          bun install
          bun run build

      # =========================
      # CREATE DEPLOY PACKAGE
      # =========================
      - name: Create deploy zip
        run: |
          mkdir deploy

          cp -r frontend/.output deploy/frontend
          cp -r backend deploy/backend

          zip -r deploy.zip deploy

      # =========================
      # UPLOAD ZIP (FTP or SCP)
      # =========================
      - name: Upload zip
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          source: "deploy.zip"
          target: "/home/${{ secrets.FTP_USER }}/deploy/"

      # =========================
      # REMOTE UNZIP + RESTART
      # =========================
      - name: Remote unzip & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          script: |
            cd ~/deploy

            unzip -o deploy.zip -d app_new

            rm -rf ~/domains/test.prosrochkapatrol.ru/frontend/*
            rm -rf ~/domains/api.test.prosrochkapatrol.ru/*

            cp -r app_new/deploy/frontend/* ~/domains/test.prosrochkapatrol.ru/frontend/
            cp -r app_new/deploy/backend/* ~/domains/api.test.prosrochkapatrol.ru/

            echo "Restarting apps..."

            # если у тебя bun processes:
            pkill bun || true
            nohup bun ~/domains/api.test.prosrochkapatrol.ru/server.js > ~/logs/api.log 2>&1 &

            echo "Deploy done"