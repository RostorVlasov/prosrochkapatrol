name: Deploy via FTP (Jino)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # SETUP BUN
      # =========================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # =========================
      # FRONTEND BUILD (NUXT)
      # =========================
      - name: Install frontend deps
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

      # =========================
      # BACKEND BUILD (BUN + PAYLOAD)
      # =========================
      - name: Install backend deps
        working-directory: ./backend
        run: bun install

      - name: Build backend
        working-directory: ./backend
        run: bun run build

      # =========================
      # CLEANUP BEFORE FTP (ВАЖНО)
      # =========================
      - name: Clean unnecessary files before deploy
        run: |
          echo "Removing junk before upload..."

          # frontend cleanup
          rm -rf frontend/node_modules
          rm -rf frontend/.git

          # backend cleanup
          rm -rf backend/node_modules
          rm -rf backend/.git

      # =========================
      # FTP DEPLOY FRONTEND
      # =========================
      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}

          local-dir: frontend/.output/

          server-dir: /domains/test.prosrochkapatrol.ru/frontend/

          # 🔥 ускоряет и убирает лишние пересканирования
          dangerous-clean-slate: false

      # =========================
      # FTP DEPLOY BACKEND
      # =========================
      - name: Deploy backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}

          local-dir: backend/

          server-dir: /domains/api.test.prosrochkapatrol.ru/

          dangerous-clean-slate: false