name: ZIP Deploy (Frontend + Backend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # SETUP BUN
      # =========================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # =========================
      # BUILD FRONTEND (NUXT)
      # =========================
      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      # =========================
      # BUILD BACKEND
      # =========================
      - name: Build backend
        working-directory: ./backend
        run: |
          bun install
          bun run build

      # =========================
      # PREPARE DEPLOY PACKAGE
      # =========================
      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy

          # frontend
          cp -r frontend/.output deploy/frontend

          # backend
          cp -r backend deploy/backend

      # =========================
      # CREATE ZIP
      # =========================
      - name: Create zip archive
        run: |
          zip -r deploy.zip deploy

      # =========================
      # UPLOAD ZIP VIA FTP
      # =========================
      - name: Upload zip to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}

          local-dir: ./
          server-dir: /deploy/

          include: deploy.zip

          log-level: minimal