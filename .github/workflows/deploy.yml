name: Deploy to Jino (Bun + Nuxt + Payload)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # FRONTEND (NUXT + BUN)
      # =========================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build frontend (Nuxt)
        working-directory: ./frontend
        run: bun run build

      # =========================
      # BACKEND (BUN + PAYLOAD)
      # =========================
      - name: Install backend dependencies
        working-directory: ./backend
        run: bun install

      - name: Build backend
        working-directory: ./backend
        run: bun run build

      # =========================
      # UPLOAD FRONTEND
      # =========================
      - name: Upload frontend (.output)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: frontend/.output
          target: ~/domains/test.prosrochkapatrol.ru/frontend

      # =========================
      # UPLOAD BACKEND
      # =========================
      - name: Upload backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: backend
          target: ~/domains/api.test.prosrochkapatrol.ru

      # =========================
      # SERVER DEPLOY
      # =========================
      - name: Run migrations + restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |

            echo "🚀 Starting deployment..."

            # =========================
            # BACKEND DEPLOY
            # =========================
            cd ~/domains/api.test.prosrochkapatrol.ru/backend

            echo "📦 Installing backend deps..."
            bun install

            echo "🧬 Running Payload migrations..."
            bunx payload migrate || npx payload migrate

            echo "🏗 Building backend..."
            bun run build

            echo "♻️ Restarting backend..."

            pkill -f "bun run start" || true
            pkill -f "node.*payload" || true

            nohup bun run start > backend.log 2>&1 &

            echo "✅ Backend running"

            # =========================
            # FRONTEND DEPLOY
            # =========================
            echo "🌐 Restarting frontend..."

            cd ~/domains/test.prosrochkapatrol.ru/frontend

            pkill -f ".output/server" || true
            nohup node .output/server/index.mjs > frontend.log 2>&1 &

            echo "🎉 DEPLOY COMPLETE"