name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # =========================
      # СБОРКА FRONTEND (Nuxt)
      # =========================
      - name: Install frontend deps
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

      # =========================
      # ПОДГОТОВКА ПАПКИ ДЛЯ ДЕПЛОЯ
      # =========================
      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy/frontend
          mkdir -p deploy/backend

          cp -r frontend/.output deploy/frontend/
          cp -r backend/src deploy/backend/
          cp backend/package.json deploy/backend/
          cp backend/package-lock.json deploy/backend/ 2>/dev/null || true
          cp backend/next.config.ts deploy/backend/ 2>/dev/null || cp backend/next.config.js deploy/backend/ 2>/dev/null || true
          cp backend/tsconfig.json deploy/backend/ 2>/dev/null || true
          cp -r backend/public deploy/backend/ 2>/dev/null || true

          echo "📊 Deploy size: $(du -sh deploy | cut -f1)"

      - name: Archive deploy folder
        run: |
          tar -czf deploy.tar.gz deploy
          echo "📦 Archive size: $(du -sh deploy.tar.gz | cut -f1)"

      # =========================
      # ЗАГРУЗКА НА СЕРВЕР
      # =========================
      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.tar.gz"
          target: "/var/www/prosrochkapatrol/"

      # =========================
      # ДЕПЛОЙ НА СЕРВЕРЕ (PM2)
      # =========================
      - name: Execute remote deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_TAR=/var/www/prosrochkapatrol/deploy.tar.gz
            WORKDIR=/var/www/prosrochkapatrol/work
            BACK=/var/www/prosrochkapatrol/back
            FRONT=/var/www/prosrochkapatrol/front
            LOGS=/var/log/prosrochkapatrol

            mkdir -p $LOGS
            mkdir -p $BACK
            mkdir -p $FRONT

            # 1. РАСПАКОВКА
            echo "📦 Extracting archive..."
            rm -rf $WORKDIR
            mkdir -p $WORKDIR
            tar -xzf $DEPLOY_TAR -C $WORKDIR

            # 2. ПОДГОТОВКА FRONTEND
            echo "🌐 Preparing frontend..."
            FRONT_TMP=$FRONT-tmp
            rm -rf $FRONT_TMP
            mkdir -p $FRONT_TMP
            cp -r $WORKDIR/deploy/frontend/.output $FRONT_TMP/

            # 3. ПОДГОТОВКА И СБОРКА BACKEND
            echo "⚙️ Deploying backend..."
            if [ -f $BACK/.env ]; then
              cp $BACK/.env /tmp/patrol-backup.env
            fi

            rm -rf $BACK/src
            rm -f $BACK/package.json $BACK/package-lock.json $BACK/next.config.* $BACK/tsconfig.json

            cp -r $WORKDIR/deploy/backend/src $BACK/
            cp -f $WORKDIR/deploy/backend/package.json $BACK/
            cp -f $WORKDIR/deploy/backend/package-lock.json $BACK/ 2>/dev/null || true
            cp -f $WORKDIR/deploy/backend/next.config.* $BACK/ 2>/dev/null || true
            cp -f $WORKDIR/deploy/backend/tsconfig.json $BACK/ 2>/dev/null || true

            if [ -d "$WORKDIR/deploy/backend/public" ]; then
              mkdir -p $BACK/public
              cp -r $WORKDIR/deploy/backend/public/* $BACK/public/ 2>/dev/null || true
            fi

            if [ -f /tmp/patrol-backup.env ]; then
              cp /tmp/patrol-backup.env $BACK/.env
            fi

            cd $BACK
            echo "📦 Installing backend dependencies..."
            npm install
            echo "🔨 Building Next.js backend..."
            npm run build

            # 4. ПЕРЕЗАПУСК ПРОЦЕССОВ ЧЕРЕЗ PM2
            echo "🔪 Restarting processes via PM2..."
            pm2 stop prosrochka-back 2>/dev/null || true
            pm2 stop prosrochka-front 2>/dev/null || true
            pm2 delete prosrochka-back 2>/dev/null || true
            pm2 delete prosrochka-front 2>/dev/null || true

            # 5. ЗАМЕНА ДИРЕКТОРИИ FRONTEND
            echo "🔄 Swapping frontend..."
            rm -rf $FRONT
            mv $FRONT_TMP $FRONT

            # 6. ЗАПУСК В PM2
            echo "▶ Starting apps in PM2..."
            cd $BACK
            pm2 start "PORT=3333 npx next start" --name prosrochka-back

            cd $FRONT
            pm2 start "PORT=3001 NITRO_PUBLIC_DIR=$FRONT/public node .output/server/index.mjs" --name prosrochka-front

            pm2 save

            # 7. ПРОВЕРКА СТАБИЛЬНОСТИ
            sleep 5
            
            if pm2 list | grep -q "prosrochka-back.*online"; then
              echo "✅ Backend is ONLINE"
            else
              echo "❌ Backend failed to start!"
              pm2 logs prosrochka-back --lines 30
              exit 1
            fi

            if pm2 list | grep -q "prosrochka-front.*online"; then
              echo "✅ Frontend is ONLINE"
            else
              echo "❌ Frontend failed to start!"
              pm2 logs prosrochka-front --lines 30
              exit 1
            fi

            # 8. ОЧИСТКА
            rm -rf $WORKDIR $DEPLOY_TAR
            echo "🎉 DEPLOY SUCCESSFUL"
