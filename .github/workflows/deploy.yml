name: Deploy to Jino (Bun + Nuxt + Payload)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # DEBUG SECRETS (SAFE)
      # =========================
      - name: Debug secrets (safe check)
        run: |
          echo "🔍 Checking secrets presence..."

          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "❌ SSH_HOST is EMPTY or NOT SET"
            exit 1
          else
            echo "✅ SSH_HOST is set (length: ${#SSH_HOST})"
          fi

          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "❌ SSH_USER is EMPTY or NOT SET"
            exit 1
          else
            echo "✅ SSH_USER is set"
          fi

          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "❌ SSH_KEY is EMPTY or NOT SET"
            exit 1
          else
            echo "✅ SSH_KEY is set (length hidden)"
          fi

          if [ -z "${{ secrets.SSH_PORT }}" ]; then
            echo "⚠️ SSH_PORT not set, defaulting to 22"
          else
            echo "✅ SSH_PORT is set: ${{ secrets.SSH_PORT }}"
          fi

      # =========================
      # FRONTEND (NUXT + BUN)
      # =========================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend deps
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

      # =========================
      # BACKEND (BUN + PAYLOAD)
      # =========================
      - name: Install backend deps
        working-directory: ./backend
        run: bun install

      - name: Build backend
        working-directory: ./backend
        run: bun run build

      # =========================
      # UPLOAD FRONTEND
      # =========================
      - name: Upload frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: frontend/.output/
          target: /home/${{ secrets.SSH_USER }}/domains/test.prosrochkapatrol.ru/frontend

      # =========================
      # UPLOAD BACKEND
      # =========================
      - name: Upload backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: backend/
          target: /home/${{ secrets.SSH_USER }}/domains/api.test.prosrochkapatrol.ru

      # =========================
      # SERVER DEPLOY
      # =========================
      - name: Deploy on server (migrate + restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |

            echo "🚀 CONNECTED TO SERVER"

            echo "📂 Backend dir check..."
            cd ~/domains/api.test.prosrochkapatrol.ru/backend || exit 1

            echo "📦 Installing backend deps..."
            bun install

            echo "🧬 Running Payload migrations..."
            npx payload migrate || bunx payload migrate

            echo "🏗 Building backend..."
            bun run build

            echo "♻️ Restart backend..."

            pkill -f "bun run start" || true
            nohup bun run start > backend.log 2>&1 &

            echo "🌐 Restart frontend..."

            cd ~/domains/test.prosrochkapatrol.ru/frontend || exit 1

            pkill -f ".output/server" || true
            nohup node .output/server/index.mjs > frontend.log 2>&1 &

            echo "🎉 DEPLOY FINISHED SUCCESSFULLY"