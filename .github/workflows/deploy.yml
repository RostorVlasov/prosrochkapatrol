name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # SETUP
      # =========================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # =========================
      # BUILD FRONTEND (Nuxt)
      # =========================
      - name: Install frontend deps
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

      # =========================
      # BUILD BACKEND (Payload/Next)
      # =========================
      - name: Install backend deps
        working-directory: ./backend
        run: bun install

      - name: Build backend
        working-directory: ./backend
        run: bun run build

      # =========================
      # PREPARE DEPLOY FOLDER
      # =========================
      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy/frontend
          mkdir -p deploy/backend

          cp -r frontend/.output deploy/frontend/

          mkdir -p deploy/backend/.next
          cp -r backend/.next/server deploy/backend/.next/
          cp -r backend/.next/static deploy/backend/.next/
          cp backend/.next/BUILD_ID deploy/backend/.next/
          cp backend/.next/build-manifest.json deploy/backend/.next/ 2>/dev/null || true
          cp backend/.next/app-path-routes-manifest.json deploy/backend/.next/ 2>/dev/null || true
          cp backend/.next/prerender-manifest.json deploy/backend/.next/ 2>/dev/null || true
          cp backend/.next/routes-manifest.json deploy/backend/.next/ 2>/dev/null || true
          cp backend/.next/required-server-files.json deploy/backend/.next/ 2>/dev/null || true
          cp backend/.next/package.json deploy/backend/.next/ 2>/dev/null || true

          cp backend/package.json deploy/backend/
          cp backend/package-lock.json deploy/backend/ 2>/dev/null || true
          cp backend/next.config.ts deploy/backend/ 2>/dev/null || true
          cp backend/next.config.js deploy/backend/ 2>/dev/null || true
          cp backend/next.config.mjs deploy/backend/ 2>/dev/null || true
          cp -r backend/public deploy/backend/ 2>/dev/null || true

          cp backend/tsconfig.json deploy/backend/
          cp -r backend/src deploy/backend/

          echo "📊 Deploy folder size: $(du -sh deploy | cut -f1)"

      # =========================
      # CREATE ZIP
      # =========================
      - name: Create deploy.zip
        run: |
          zip -r deploy.zip deploy
          echo "📦 Archive size: $(du -sh deploy.zip | cut -f1)"

      # =========================
      # UPLOAD ZIP TO SERVER
      # =========================
      - name: Upload deploy.zip to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.zip"
          target: "/var/www/prosrochkapatrol/"

      # =========================
      # DEPLOY ON SERVER
      # =========================
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_ZIP=/var/www/prosrochkapatrol/deploy.zip
            WORKDIR=/var/www/prosrochkapatrol/work
            BACK=/var/www/prosrochkapatrol/back
            FRONT=/var/www/prosrochkapatrol/front
            LOGS=/var/log/prosrochkapatrol
            BACK_PID=/var/run/prosrochkapatrol-back.pid
            FRONT_PID=/var/run/prosrochkapatrol-front.pid

            mkdir -p $LOGS

            # =========================
            # UNZIP
            # =========================
            echo "📦 Unzipping..."
            rm -rf $WORKDIR
            mkdir -p $WORKDIR
            unzip -o $DEPLOY_ZIP -d $WORKDIR

            # =========================
            # DEPLOY FRONTEND
            # =========================
            echo "🌐 Deploy frontend..."
            rm -rf $FRONT/.output
            mkdir -p $FRONT
            cp -r $WORKDIR/deploy/frontend/.output $FRONT/

            # =========================
            # DEPLOY BACKEND
            # =========================
            echo "⚙️ Deploy backend..."

            rm -rf $BACK/.next
            rm -rf $BACK/public
            rm -rf $BACK/node_modules

            cp -r $WORKDIR/deploy/backend/. $BACK/

            cd $BACK

            # INSTALL DEPENDENCIES
            echo "📦 Installing dependencies..."
            npm install --omit=dev

            echo "📦 Installing native binaries..."
            npm install @img/sharp-linux-x64 @img/sharp-libvips-linux-x64

            echo "✅ Dependencies installed"

            # =========================
            # FIX MONGODB PERMISSIONS
            # =========================
            chown -R mongodb:mongodb /var/lib/mongodb
            chmod -R 750 /var/lib/mongodb
            chown -R mongodb:mongodb /var/log/mongodb

            # =========================
            # ENSURE MONGODB IS RUNNING
            # =========================
            echo "🍃 Checking MongoDB..."
            if ! systemctl is-active --quiet mongod; then
              echo "⚠️ MongoDB not running, starting..."
              systemctl start mongod
              sleep 5
            fi

            if systemctl is-active --quiet mongod; then
              echo "✅ MongoDB is running"
            else
              echo "❌ MongoDB failed to start!"
              journalctl -u mongod -n 20 --no-pager --since "2 minutes ago"
              exit 1
            fi

            # =========================
            # KILL OLD PROCESSES
            # =========================
            echo "🔪 Killing old processes..."

            if [ -f "$BACK_PID" ]; then
              kill -9 $(cat $BACK_PID) 2>/dev/null || true
              rm -f $BACK_PID
            fi

            if [ -f "$FRONT_PID" ]; then
              kill -9 $(cat $FRONT_PID) 2>/dev/null || true
              rm -f $FRONT_PID
            fi

            sleep 3

            # =========================
            # START BACKEND
            # =========================
            echo "▶ Starting backend on port 3333..."
            cd $BACK
            PORT=3333 nohup node node_modules/.bin/next start > $LOGS/backend.log 2>&1 &
            echo $! > $BACK_PID

            # =========================
            # START FRONTEND
            # =========================
            echo "▶ Starting frontend on port 3001..."
            cd $FRONT
            PORT=3001 nohup node .output/server/index.mjs > $LOGS/frontend.log 2>&1 &
            echo $! > $FRONT_PID

            # =========================
            # CHECK
            # =========================
            sleep 5

            if kill -0 $(cat $BACK_PID) 2>/dev/null; then
              echo "✅ Backend is running on port 3333"
            else
              echo "❌ Backend crashed! Log:"
              tail -30 $LOGS/backend.log
              exit 1
            fi

            if kill -0 $(cat $FRONT_PID) 2>/dev/null; then
              echo "✅ Frontend is running on port 3001"
            else
              echo "❌ Frontend crashed! Log:"
              tail -20 $LOGS/frontend.log
              exit 1
            fi

            rm -rf $WORKDIR $DEPLOY_ZIP

            echo "🎉 DEPLOY COMPLETE"