name: Деплой на сервер

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Установка Bun
        uses: oven-sh/setup-bun@v1

      # =========================
      # СБОРКА FRONTEND (Nuxt)
      # =========================
      - name: Сборка фронтенда
        working-directory: ./frontend
        run: |
          echo "🔨 Собираем фронтенд..."
          bun install > /dev/null 2>&1
          bun run build > /dev/null 2>&1
          echo "✅ Фронтенд собран"

      # =========================
      # ПОДГОТОВКА ПАКЕТА ДЛЯ ДЕПЛОЯ
      # =========================
      - name: Подготовка архива
        run: |
          echo "📦 Готовим архив для деплоя..."
          rm -rf deploy
          mkdir -p deploy/frontend deploy/backend
          cp -r frontend/.output deploy/frontend/
          cp -r backend/src deploy/backend/
          cp backend/package.json deploy/backend/
          cp backend/package-lock.json deploy/backend/ 2>/dev/null || true
          cp backend/next.config.* deploy/backend/ 2>/dev/null || true
          cp backend/tsconfig.json deploy/backend/ 2>/dev/null || true
          cp -r backend/public deploy/backend/ 2>/dev/null || true
          tar -czf deploy.tar.gz deploy
          echo "✅ Архив готов ($(du -sh deploy.tar.gz | cut -f1))"

      # =========================
      # ЗАГРУЗКА НА СЕРВЕР
      # =========================
      - name: Отправка на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.tar.gz"
          target: "/var/www/prosrochkapatrol/"

      # =========================
      # УДАЛЁННЫЙ ДЕПЛОЙ (PM2)
      # =========================
      - name: Развёртывание на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e

            # Переменные
            DEPLOY_TAR="/var/www/prosrochkapatrol/deploy.tar.gz"
            WORKDIR="/var/www/prosrochkapatrol/work"
            BACK="/var/www/prosrochkapatrol/back"
            FRONT="/var/www/prosrochkapatrol/front"

            # Красивые цвета
            GREEN='\033[0;32m'
            RED='\033[0;31m'
            YELLOW='\033[0;33m'
            NC='\033[0m'

            echo -e "${GREEN}🚀 Запускаем деплой...${NC}"

            # 1. Распаковка
            echo -n "📦 Распаковываем архив... "
            rm -rf $WORKDIR && mkdir -p $WORKDIR
            tar -xzf $DEPLOY_TAR -C $WORKDIR > /dev/null 2>&1
            echo -e "${GREEN}готово${NC}"

            # 2. Подготовка фронтенда
            echo -n "🌐 Подготавливаем фронтенд... "
            FRONT_TMP="$FRONT-tmp"
            rm -rf $FRONT_TMP && mkdir -p $FRONT_TMP
            cp -r $WORKDIR/deploy/frontend/.output $FRONT_TMP/
            echo -e "${GREEN}готово${NC}"

            # 3. Подготовка и сборка бэкенда
            echo -n "⚙️ Собираем бэкенд... "
            # Сохраняем .env, если есть
            [ -f $BACK/.env ] && cp $BACK/.env /tmp/backup.env
            # Очищаем старые файлы
            rm -rf $BACK/src $BACK/package.json $BACK/package-lock.json $BACK/next.config.* $BACK/tsconfig.json 2>/dev/null || true
            # Копируем новые
            cp -r $WORKDIR/deploy/backend/src $BACK/
            cp -f $WORKDIR/deploy/backend/package.json $BACK/
            cp -f $WORKDIR/deploy/backend/package-lock.json $BACK/ 2>/dev/null || true
            cp -f $WORKDIR/deploy/backend/next.config.* $BACK/ 2>/dev/null || true
            cp -f $WORKDIR/deploy/backend/tsconfig.json $BACK/ 2>/dev/null || true
            [ -d "$WORKDIR/deploy/backend/public" ] && cp -r $WORKDIR/deploy/backend/public/* $BACK/public/ 2>/dev/null || true
            # Восстанавливаем .env
            [ -f /tmp/backup.env ] && cp /tmp/backup.env $BACK/.env
            # Устанавливаем зависимости и собираем (тихо)
            cd $BACK
            npm install --silent > /dev/null 2>&1
            npm run build --silent > /dev/null 2>&1
            echo -e "${GREEN}готово${NC}"

            # 4. Перезапуск PM2
            echo -n "🔄 Перезапускаем PM2... "
            pm2 delete all 2>/dev/null || true
            cd $BACK
            PORT=3333 pm2 start npm --name "prosrochka-back" -- start > /dev/null 2>&1
            cd $FRONT
            PORT=3001 pm2 start node --name "prosrochka-front" -- .output/server/index.mjs > /dev/null 2>&1
            pm2 save > /dev/null 2>&1
            echo -e "${GREEN}готово${NC}"

            # 5. Проверка статуса
            sleep 5
            echo -n "✅ Проверяем статус... "
            if pm2 list | grep -q "prosrochka-back.*online" && pm2 list | grep -q "prosrochka-front.*online"; then
              echo -e "${GREEN}ОК${NC}"
            else
              echo -e "${RED}ОШИБКА${NC}"
              echo "❌ Процессы не запущены. Логи:"
              pm2 logs --lines 20
              exit 1
            fi

            # 6. Замена директории фронтенда (после запуска, чтобы минимизировать простой)
            echo -n "🔄 Применяем фронтенд... "
            rm -rf $FRONT
            mv $FRONT_TMP $FRONT
            echo -e "${GREEN}готово${NC}"

            # 7. Проверка работоспособности
            echo -n "🏥 Проверка здоровья... "
            BACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3333 2>/dev/null || echo "000")
            FRONT_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 2>/dev/null || echo "000")
            if [[ "$BACK_CODE" =~ ^(200|404)$ ]] && [[ "$FRONT_CODE" =~ ^(200|404)$ ]]; then
              echo -e "${GREEN}ОК${NC} (бэк: $BACK_CODE, фронт: $FRONT_CODE)"
            else
              echo -e "${YELLOW}ПРЕДУПРЕЖДЕНИЕ${NC} (бэк: $BACK_CODE, фронт: $FRONT_CODE)"
            fi

            # 8. Очистка
            rm -rf $WORKDIR $DEPLOY_TAR
            echo -e "${GREEN}🎉 Деплой успешно завершён!${NC}"
