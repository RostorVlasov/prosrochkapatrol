name: Deploy production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build deploy artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install backend dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Build backend
        working-directory: ./backend
        env:
          DATABASE_URI: mongodb://127.0.0.1:27017/prosrochkapatrol-build
          PAYLOAD_SECRET: build-secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_USER: ci@example.com
          SMTP_PASS: ci-password
        run: pnpm run build

      - name: Package release bundle
        run: |
          set -euo pipefail
          rm -rf dist deploy.tar.gz
          mkdir -p dist/frontend dist/backend/.next
          cp -R frontend/.output dist/frontend/.output
          cp -R backend/.next/standalone/. dist/backend/
          cp -R backend/.next/static dist/backend/.next/static
          if [ -d backend/public ]; then
            cp -R backend/public dist/backend/public
          fi
          cp backend/package.json dist/backend/package.json
          tar -czf deploy.tar.gz -C dist .

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-bundle
          path: deploy.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-artifacts
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: production-deploy-bundle

      - name: Upload release bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy.tar.gz
          target: /var/www/prosrochkapatrol/

      - name: Deploy release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            ROOT="/var/www/prosrochkapatrol"
            DEPLOY_TAR="$ROOT/deploy.tar.gz"
            WORKDIR="$ROOT/work"
            BACK="$ROOT/back"
            FRONT="$ROOT/front"
            BACK_NEW="$ROOT/back-new"
            FRONT_NEW="$ROOT/front-new"
            BACK_PREV="$ROOT/back-previous"
            FRONT_PREV="$ROOT/front-previous"
            BACK_NAME="prosrochka-back"
            FRONT_NAME="prosrochka-front"

            rollback() {
              echo "⚠️ Ошибка деплоя, откатываемся..."
              pm2 delete "$BACK_NAME" 2>/dev/null || true
              pm2 delete "$FRONT_NAME" 2>/dev/null || true

              rm -rf "$BACK" "$FRONT"
              [ -d "$BACK_PREV" ] && mv "$BACK_PREV" "$BACK"
              [ -d "$FRONT_PREV" ] && mv "$FRONT_PREV" "$FRONT"

              if [ -f "$BACK/server.js" ]; then
                cd "$BACK"
                PORT=3333 pm2 start node --name "$BACK_NAME" -- server.js
              fi

              if [ -f "$FRONT/.output/server/index.mjs" ]; then
                cd "$FRONT"
                PORT=3001 pm2 start node --name "$FRONT_NAME" -- .output/server/index.mjs
              fi

              pm2 save >/dev/null 2>&1 || true
            }

            trap rollback ERR

            rm -rf "$WORKDIR" "$BACK_NEW" "$FRONT_NEW"
            mkdir -p "$WORKDIR" "$BACK_NEW" "$FRONT_NEW"
            tar -xzf "$DEPLOY_TAR" -C "$WORKDIR"

            cp -R "$WORKDIR/frontend/.output" "$FRONT_NEW/.output"
            cp -a "$WORKDIR/backend/." "$BACK_NEW/"

            if [ -f "$BACK/.env" ]; then
              cp "$BACK/.env" "$BACK_NEW/.env"
            fi

            rm -rf "$BACK_PREV" "$FRONT_PREV"
            [ -d "$BACK" ] && mv "$BACK" "$BACK_PREV"
            [ -d "$FRONT" ] && mv "$FRONT" "$FRONT_PREV"
            mv "$BACK_NEW" "$BACK"
            mv "$FRONT_NEW" "$FRONT"

            pm2 delete "$BACK_NAME" 2>/dev/null || true
            pm2 delete "$FRONT_NAME" 2>/dev/null || true

            cd "$BACK"
            PORT=3333 pm2 start node --name "$BACK_NAME" -- server.js

            cd "$FRONT"
            PORT=3001 pm2 start node --name "$FRONT_NAME" -- .output/server/index.mjs

            pm2 save >/dev/null 2>&1
            sleep 5

            pm2 show "$BACK_NAME" >/dev/null
            pm2 show "$FRONT_NAME" >/dev/null

            BACK_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:3333/admin || echo "000")
            FRONT_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || echo "000")

            if [ "$BACK_CODE" != "200" ] || [ "$FRONT_CODE" != "200" ]; then
              echo "Healthcheck failed: backend=$BACK_CODE frontend=$FRONT_CODE"
              exit 1
            fi

            rm -rf "$WORKDIR" "$DEPLOY_TAR" "$BACK_PREV" "$FRONT_PREV"
            echo "✅ Деплой успешно завершён"
